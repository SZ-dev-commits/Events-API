name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t events-api:latest .

      - name: Run container and health check
        run: |
          docker run -d -p 5000:5000 --name events-api-container events-api:latest
          sleep 5
          curl --fail http://localhost:5000/ || exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest -v tests/

      - name: Clean up container
        if: always()
        run: |
          docker stop events-api-container || true
          docker rm events-api-container || true

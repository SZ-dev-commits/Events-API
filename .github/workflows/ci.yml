name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Base test job running python environment checks
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  # Deploy job that runs only if tests pass successfully
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Log into Docker Hub registry using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push the fresh production image
      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/events-api:latest

      # Trigger Render via the deploy hook URL
      - name: Trigger Render web service deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # Hold execution to allow the free tier container to startup
      - name: Wait for service rollout
        run: |
          sleep 90

      # Execute automated live smoke test against the live api health route
      - name: Execute live smoke test
        run: |
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_BASE_URL }}/api/health")
          echo "Server responded with code: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Smoke test failed. Target endpoint is down."
            exit 1
          fi
          echo "Deployment verified successfully."
